// smart_run/setup/cov_hier.cfg  --  VCS -cm_hier configuration file.
//
// Restricts coverage instrumentation to the five pipeline units the randomized
// stress tests target. Everything else (SoC, AXI crossbar, SRAM models, TB) is
// excluded, which keeps the -cm slowdown and the .vdb size down and keeps the
// urg module report readable.
//
// Syntax: "-tree <inst>" excludes an instance subtree, "+tree <inst>" includes
// one. Lines are processed in order and later lines override earlier ones, so
// the blanket exclusion comes first.
//
// NOTE: instance paths must track logical/tb/tb.v + common/soc.v. If the SoC
// wrapper is ever renamed this file goes stale silently -- urg will simply
// report zero coverage. Cross-check against the CORE constant in
// cli_tools/gen_toggle_mon.py, which encodes the same hierarchy prefix.

-tree tb

+tree tb.x_soc.x_cpu_sub_system_axi.x_c906_wrapper.x_cpu_top.x_aq_top_0.x_aq_core.x_aq_ifu_top
+tree tb.x_soc.x_cpu_sub_system_axi.x_c906_wrapper.x_cpu_top.x_aq_top_0.x_aq_core.x_aq_idu_top
+tree tb.x_soc.x_cpu_sub_system_axi.x_c906_wrapper.x_cpu_top.x_aq_top_0.x_aq_core.x_aq_iu_top
+tree tb.x_soc.x_cpu_sub_system_axi.x_c906_wrapper.x_cpu_top.x_aq_top_0.x_aq_core.x_aq_vidu_top
+tree tb.x_soc.x_cpu_sub_system_axi.x_c906_wrapper.x_cpu_top.x_aq_top_0.x_aq_core.x_aq_cp0_top

// The I-cache behavioural SRAM arrays live inside x_aq_ifu_top and are pulled
// in by the +tree above. They are memory models, not design logic -- their
// toggle and line numbers only dilute the IFU percentage.
-tree tb.x_soc.x_cpu_sub_system_axi.x_c906_wrapper.x_cpu_top.x_aq_top_0.x_aq_core.x_aq_ifu_top.x_aq_ifu_icache.x_aq_ifu_icache_tag_array
-tree tb.x_soc.x_cpu_sub_system_axi.x_c906_wrapper.x_cpu_top.x_aq_top_0.x_aq_core.x_aq_ifu_top.x_aq_ifu_icache.x_aq_ifu_icache_data_array

// Alternative if the instance-path form gives trouble on a given VCS version:
// module-name selection. All five units are singly instantiated, so this is
// equivalent and hierarchy-proof -- but "-module *" is not universally
// supported, so prefer the -tree form above.
//   -module *
//   +module aq_ifu_top
//   +module aq_idu_top
//   +module aq_iu_top
//   +module aq_vidu_top
//   +module aq_cp0_top
